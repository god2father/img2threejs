<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e7e2" />
    <title>NOIR S1 · Exploded Product View</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="NOIR S1 模块化扬声器比例验收模型"></canvas>
      <section class="hud" aria-label="产品信息与拆解控制">
        <p class="eyebrow">NOIR LABS · MODULAR AUDIO</p>
        <h1>NOIR S1<br /><em>Inside the sound.</em></h1>
        <p class="summary">黑色软包、孔洞金属网罩、黄铜控制与可维护的声学腔体。点击部件，查看八个真实服务组件的装配关系。</p>
        <button class="explode-button" id="explode-button" type="button" aria-pressed="false"><span>EXPLODE VIEW</span><i aria-hidden="true">↗</i></button>
      </section>
      <aside class="spec-card" aria-label="八个可维护组件">
        <p class="part-count">8 SERVICE COMPONENTS</p>
        <div class="part-list">
          <button class="part-button" type="button" data-part-id="grille" aria-pressed="false"><span>01</span>Metal grille</button>
          <button class="part-button" type="button" data-part-id="driver-baffle" aria-pressed="false"><span>02</span>Driver baffle</button>
          <button class="part-button" type="button" data-part-id="acoustic-chamber" aria-pressed="false"><span>03</span>MDF chamber</button>
          <button class="part-button" type="button" data-part-id="amplifier-board" aria-pressed="false"><span>04</span>Internal PCB</button>
          <button class="part-button" type="button" data-part-id="top-control-deck" aria-pressed="false"><span>05</span>Top control panel</button>
          <button class="part-button" type="button" data-part-id="rear-io-plate" aria-pressed="false"><span>06</span>Rear brass I/O</button>
          <button class="part-button" type="button" data-part-id="rear-panel" aria-pressed="false"><span>07</span>Rear cover</button>
          <button class="part-button" type="button" data-part-id="isolation-feet" aria-pressed="false"><span>08</span>Feet & hardware</button>
        </div>
      </aside>
      <p class="interaction-hint">DRAG TO ORBIT · SCROLL TO ZOOM</p>
      <output class="stage-badge" id="stage-badge">ASSEMBLED · INTERACTIVE</output>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
